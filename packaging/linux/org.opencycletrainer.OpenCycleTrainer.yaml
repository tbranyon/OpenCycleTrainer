app-id: org.opencycletrainer.OpenCycleTrainer
base: io.qt.PySide.BaseApp
base-version: "6.10"
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: opencycletrainer

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --filesystem=xdg-documents

modules:
  # Generated from uv.lock by scripts/build_linux.sh (see flatpak_deps.py next to this file).
  - ../../build/linux/python-deps.json

  - name: opencycletrainer
    buildsystem: simple
    build-commands:
      - python3 -m pip install --verbose --no-index --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 res/icon_nobg.png /app/share/opencycletrainer/res/icon_nobg.png
      - install -Dm644 res/icon_512.png /app/share/icons/hicolor/512x512/apps/org.opencycletrainer.OpenCycleTrainer.png
      - install -Dm644 packaging/linux/org.opencycletrainer.OpenCycleTrainer.desktop /app/share/applications/org.opencycletrainer.OpenCycleTrainer.desktop
      - install -d /app/share/opencycletrainer/workouts
      - install -m644 workouts/*.mrc /app/share/opencycletrainer/workouts/
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - .tmp_runtime
          - build
          - dist
